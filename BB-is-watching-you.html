<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>BB is watching you</title>
	<style>
		#start-panel { position: absolute; left: 20px; top: 20px; z-index: 1000; font-family: sans-serif; }
		#start-button { font-size: 1.4em; padding: 0.4em 1em; cursor: pointer; }
		#status { margin-top: 0.5em; color: #b00; max-width: 40em; }
	</style>
</head>
<body>
	<div id="start-panel">
		<button id="start-button" type="button">Start the camera</button>
		<div id="status"></div>
	</div>
	<canvas id="canvas-blended" width="1366" height="768"></canvas>

	<script src="../../lib/circularbuffer.js"></script>
	<script src="../../lib/events.js"></script>
	<script src="../../lib/detectors.js"></script>
	<script src="../../lib/main.js"></script>
	<script src="compat.js"></script>
	<script src="eyes.js"></script>
	<script>
	var WIDTH = 1366, HEIGHT = 768;
	var N_AUDIO = 6;          // output0.mp3 ... output5.mp3 (optional)
	var AUDIO_DELAY = 3000;   // ms between two messages

	var guy = new Guy({ 'position': 'absolute', 'x': 350, 'y': 38, 'scale': 5 });

	function setStatus(msg) {
		document.getElementById("status").textContent = msg || "";
	}

	function startEngine() {
		var problem = CamMotionCompat.problem();
		if (problem) {
			setStatus(problem);
			return;
		}

		var canvas = document.getElementById("canvas-blended");
		var button = document.getElementById("start-button");
		button.disabled = true;
		setStatus("");

		var camMotion = CamMotion.Engine({
			videoNode: CamMotionCompat.install(WIDTH, HEIGHT),
			canvasBlended: canvas,
			width: WIDTH,
			height: HEIGHT
		});

		camMotion.on("error", function (e) {
			console.log("error", e);
			var ex = e && e.exception;
			if (ex && (ex.name === "NotAllowedError" || ex.name === "SecurityError")) {
				setStatus("Camera access was denied. Allow it in the browser and try again.");
			} else if (ex && ex.name === "NotFoundError") {
				setStatus("No camera was found.");
			} else {
				setStatus((e && e.msg) || "Could not start the camera.");
			}
			button.disabled = false;
		});
		camMotion.on("streamInit", function (e) {
			console.log("webcam stream initialized", e);
			document.getElementById("start-panel").style.display = "none";
		});

		var lastMessageTime = 0;
		var i_audio = 0;
		camMotion.on("frame", function () {
			var point = camMotion.getMovementPoint(true);
			if (camMotion.getAverageMovement(point.x - point.r / 2, point.y - point.r / 2, point.r, point.r) > 2) {
				window.dispatchEvent(new CustomEvent('camMotion', { detail: { x: point.x, y: point.y } }));

				var now = Date.now();
				if (now - lastMessageTime > AUDIO_DELAY) {
					lastMessageTime = now;
					var audio = new Audio('output' + i_audio + '.mp3');
					i_audio = (i_audio + 1) % N_AUDIO;
					// Audio files are optional: ignore missing files / blocked playback.
					var p = audio.play();
					if (p && p.catch) { p.catch(function (err) { console.log("audio not played:", err.message); }); }
				}
			}
		});
		camMotion.start();
	}

	// Browsers only allow camera prompts and sound after a user action,
	// so everything starts from this click.
	document.getElementById("start-button").addEventListener("click", startEngine);
	window.addEventListener("load", function () {
		setStatus(CamMotionCompat.problem());
	});
	</script>
</body>
</html>
